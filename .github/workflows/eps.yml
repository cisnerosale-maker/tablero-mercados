name: Actualizar EPS

on:
  schedule:
    # Días hábiles: 12:15, 14:15, 16:15 y 18:15 hora argentina (con el mercado de EE.UU. abierto)
    - cron: "15 15-21/2 * * 1-5"
    # Después del cierre de EE.UU.: 19:30 hora argentina
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-eps
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar precios y EPS nuevos
        run: python scripts/update_eps.py

      - name: Guardar datos
        run: |
          git config user.name "tablero-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eps/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "EPS $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
            git pull --rebase
            git push
          fi
