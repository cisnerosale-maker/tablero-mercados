name: Estimaciones de EPS

on:
  schedule:
    # Una vez por semana: sábados 9:20 hora argentina
    - cron: "20 12 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: estimaciones-eps
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar estimaciones con Yahoo
        run: python scripts/update_estimaciones.py

      - name: Guardar datos
        run: |
          git config user.name "tablero-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eps/estimaciones.json data/eps/estimaciones_historial.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Estimaciones EPS $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 10
            done
          fi
