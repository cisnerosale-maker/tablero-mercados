name: Actualizar datos

on:
  schedule:
    # GitHub no respeta los "cada 30 minutos" (se perdían casi todas las ejecuciones).
    # Ahora cada ejecución queda activa y actualiza cada 15 minutos hasta las 18:40 hora argentina.
    # Hay varios arranques en el día por si alguno se pierde (si uno ya está corriendo, el otro espera).
    - cron: "11 11 * * *"        # 08:11 todos los días (fines de semana: una sola vuelta)
    - cron: "43 12 * * 1-5"      # 09:43
    - cron: "17 15 * * 1-5"      # 12:17
    - cron: "52 17 * * 1-5"      # 14:52
    - cron: "26 20 * * 1-5"      # 17:26
  workflow_dispatch:
    inputs:
      ciclo:
        description: "Quedarse actualizando cada 15 minutos hasta el cierre"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar y guardar datos cada 15 minutos (horario de mercado)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.ciclo }}" = "true" ]; then export UNA_VEZ=0; else export UNA_VEZ=1; fi
          bash scripts/ciclo.sh "python scripts/update_data.py" "Datos" data/
