name: Actualizar datos

on:
  schedule:
    # Cada 30 minutos de lunes a viernes, de 10 a 18:30 hora argentina (13 a 21:30 UTC)
    - cron: "*/30 13-21 * * 1-5"
    # Una vez por día, todos los días, a las 8 hora argentina
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar datos
        run: python scripts/update_data.py

      - name: Guardar datos
        run: |
          git config user.name "tablero-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
            git pull --rebase
            git push
          fi
