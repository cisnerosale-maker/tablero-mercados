name: Cartera

on:
  schedule:
    # GitHub no respeta los "cada 30 minutos": cada arranque queda activo y actualiza cada 15 minutos
    # hasta las 18:40 hora argentina. Varios arranques por si alguno se pierde (el siguiente espera).
    - cron: "48 12 * * 1-5"      # 09:48
    - cron: "22 15 * * 1-5"      # 12:22
    - cron: "57 17 * * 1-5"      # 14:57
    # Después del cierre: 19:15 hora argentina (recalcula ratios, beta y bases del día)
    - cron: "15 22 * * 1-5"
  push:
    paths:
      - "scripts/update_cartera.py"
      - "data/cartera/activos.json"
      - "data/cartera/flujos.json"
      - "data/cartera/control.json"
      - "data/cartera/manual.json"
      - ".github/workflows/cartera.yml"
  workflow_dispatch:
    inputs:
      fund:
        description: "Recalcular ratios y beta"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cartera
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar precios, ratios y bonos
        run: |
          RUTAS="data/cartera/datos.json data/cartera/fundamentos.json data/cartera/historial.json"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.fund }}" = "true" ] || [ "${{ github.event.schedule }}" = "15 22 * * 1-5" ]; then
            UNA_VEZ=1 bash scripts/ciclo.sh "python scripts/update_cartera.py --fund" "Cartera" $RUTAS
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            bash scripts/ciclo.sh "python scripts/update_cartera.py" "Cartera" $RUTAS
          else
            UNA_VEZ=1 bash scripts/ciclo.sh "python scripts/update_cartera.py" "Cartera" $RUTAS
          fi
